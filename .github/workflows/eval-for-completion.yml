name: MWR eval for-head completion
on:
  push:
    paths:
      - '.github/workflows/eval-for-completion.yml'
      - 'gc-lab/src/script/loops.rs'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  eval-for:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust
        run: rustup toolchain install stable --profile minimal
      - name: Build checker
        run: cargo +stable build --manifest-path gc-lab/Cargo.toml --bin js_check --release --offline
      - name: Fetch pinned Test262
        run: python3 gc-lab/conformance/fetch.py
      - name: Verify direct and indirect eval empty for completions
        shell: bash
        run: |
          python3 - <<'PY'
          import json
          paths=['language/eval-code/direct/cptn-nrml-empty-for.js',
                 'language/eval-code/indirect/cptn-nrml-empty-for.js']
          json.dump(paths,open('for-completion-cases.json','w'),indent=2)
          PY
          for engine in tree vm; do
            for gc in normal stress; do
              extra=()
              if [ "$gc" = "stress" ]; then extra+=(--gc-stress); fi
              python3 gc-lab/conformance/run.py --profile full \
                --source gc-lab/.test262-source \
                --binary gc-lab/target/release/js_check \
                --paths-file for-completion-cases.json \
                --engine "$engine" "${extra[@]}" \
                --workers 2 --retry-timeouts 1 \
                --output "gc-lab/conformance/eval-for-$engine-$gc"
              python3 - "$engine" "$gc" <<'PY'
          import json,sys
          engine,gc=sys.argv[1:]
          s=json.load(open(f'gc-lab/conformance/eval-for-{engine}-{gc}/summary.json'))
          print(engine,gc,s['counts'])
          assert s['total']==2 and s['counts'].get('passed')==2,s
          PY
            done
          done
