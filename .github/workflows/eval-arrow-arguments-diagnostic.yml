name: MWR direct eval arrow arguments diagnostic
on:
  push:
    paths:
      - '.github/workflows/eval-arrow-arguments-diagnostic.yml'
      - 'gc-lab/conformance/eval-arrow-arguments-paths.json'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  eval-arrow:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust
        run: rustup toolchain install stable --profile minimal
      - name: Build checker
        run: cargo +stable build --manifest-path gc-lab/Cargo.toml --bin js_check --release --offline
      - name: Fetch pinned Test262
        run: python3 gc-lab/conformance/fetch.py
      - name: Run eight official cases in Tree VM and GC default/stress
        shell: bash
        run: |
          for engine in tree vm; do
            for gc in default stress; do
              extra=""
              if [ "$gc" = stress ]; then extra="--gc-stress"; fi
              set +e
              python3 gc-lab/conformance/run.py --profile full --engine "$engine" $extra \
                --source gc-lab/.test262-source \
                --binary gc-lab/target/release/js_check \
                --paths-file gc-lab/conformance/eval-arrow-arguments-paths.json \
                --output "gc-lab/conformance/eval-arrow-$engine-$gc"
              set -e
              python3 - "gc-lab/conformance/eval-arrow-$engine-$gc/summary.json" <<'PY'
          import json,sys
          s=json.load(open(sys.argv[1]))
          print(sys.argv[1],s['counts'],[(x['path'],x['reason'][:160]) for x in s['failures']])
          assert s['total']==8 and sum(s['counts'].values())==8
          PY
            done
          done
      - name: Preserve four individual diagnostic reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mwr-eval-arrow-arguments-diagnostics
          path: gc-lab/conformance/eval-arrow-*/
