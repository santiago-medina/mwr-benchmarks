name: MWR Symbol BigInt constructor semantics
on:
  push:
    paths:
      - '.github/workflows/symbol-bigint-constructor.yml'
      - 'gc-lab/src/script/execute.rs'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  constructor:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust
        run: rustup toolchain install stable --profile minimal
      - name: Build checker
        run: cargo +stable build --manifest-path gc-lab/Cargo.toml --bin js_check --release --offline
      - name: Fetch pinned Test262
        run: python3 gc-lab/conformance/fetch.py
      - name: Validate official Symbol and BigInt constructibility Tree VM GC stress
        run: |
          python3 - <<'PY'
          import json,subprocess
          root='gc-lab/.test262-source/test/'
          paths=('built-ins/Symbol/is-constructor.js',
                 'built-ins/BigInt/is-a-constructor.js',
                 'language/statements/class/subclass/builtin-objects/Symbol/new-symbol-with-super-throws.js',
                 'language/statements/class/subclass/builtin-objects/Symbol/symbol-valid-as-extends-value.js')
          for path in paths:
            for engine in ('tree','vm'):
              for stress in (False,True):
                cmd=['gc-lab/target/release/js_check',root+path,'--engine='+engine]+(['--gc-stress'] if stress else [])
                p=subprocess.run(cmd,text=True,capture_output=True,timeout=50)
                print(path,engine,stress,p.returncode,p.stdout[-450:],p.stderr[-200:],flush=True)
                d=json.loads(p.stdout)
                assert p.returncode==0 and d['status']=='passed' and d['cleanup'] is True,(path,engine,stress,d)
          print('16/16 passed')
          PY
