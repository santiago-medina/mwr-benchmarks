name: MWR String Symbol constructor conformance
on:
  push:
    paths:
      - '.github/workflows/string-symbol-constructor.yml'
      - 'gc-lab/src/script/execute.rs'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  string-symbol:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install stable Rust
        run: rustup toolchain install stable --profile minimal
      - name: Build checker
        run: cargo +stable build --manifest-path gc-lab/Cargo.toml --bin js_check --release --offline
      - name: Fetch pinned Test262
        run: python3 gc-lab/conformance/fetch.py
      - name: Verify official String symbol wrapping case under Tree and VM and GC stress
        run: |
          python3 - <<'PY'
          import json,subprocess
          path='gc-lab/.test262-source/test/built-ins/String/symbol-wrapping.js'
          for mode in ('tree','vm'):
            for stress in (False,True):
              cmd=['gc-lab/target/release/js_check',path,'--engine='+mode]+(['--gc-stress'] if stress else [])
              p=subprocess.run(cmd,capture_output=True,text=True,timeout=40)
              print(mode,stress,p.returncode,p.stdout[-500:],p.stderr[-300:],flush=True)
              d=json.loads(p.stdout)
              assert p.returncode==0 and d['status']=='passed' and d['cleanup'] is True
          PY
