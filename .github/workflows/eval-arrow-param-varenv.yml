name: MWR arrow param eval var environment
on:
  push:
    paths:
      - '.github/workflows/eval-arrow-param-varenv.yml'
      - 'gc-lab/src/script/parameters.rs'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  eval-arrow:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install stable Rust
        run: rustup toolchain install stable --profile minimal
      - name: Build checker
        run: cargo +stable build --manifest-path gc-lab/Cargo.toml --bin js_check --release --offline
      - name: Fetch pinned Test262
        run: python3 gc-lab/conformance/fetch.py
      - name: Require eight official eval-arrow cases to pass in four modes
        shell: bash
        run: |
          for engine in tree vm; do
            for gc in default stress; do
              gc_flag=""
              if [ "$gc" = stress ]; then gc_flag="--gc-stress"; fi
              set +e
              python3 gc-lab/conformance/run.py --profile full --engine "$engine" $gc_flag \
                --source gc-lab/.test262-source \
                --binary gc-lab/target/release/js_check \
                --paths-file gc-lab/conformance/eval-arrow-arguments-paths.json \
                --output "gc-lab/conformance/eval-arrow-$engine-$gc"
              set -e
              python3 - "gc-lab/conformance/eval-arrow-$engine-$gc/summary.json" <<'PY'
          import json,sys
          s=json.load(open(sys.argv[1]))
          print(sys.argv[1],s['counts'],s['failures'][:3])
          assert s['total']==8 and s['counts'].get('passed')==8
          PY
            done
          done
      - name: Preserve detailed reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mwr-arrow-eval-varenv
          path: gc-lab/conformance/eval-arrow-*/
