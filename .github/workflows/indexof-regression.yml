name: MWR indexOf targeted conformance
on:
  push:
    paths:
      - '.github/workflows/indexof-regression.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  indexof:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust
        run: rustup toolchain install stable --profile minimal
      - name: Build checker
        run: cargo +stable build --manifest-path gc-lab/Cargo.toml --bin js_check --release --offline
      - name: Fetch official pinned Test262
        run: python3 gc-lab/conformance/fetch.py
      - name: Run official failing case in tree and VM, normal and GC stress
        run: |
          python3 - <<'PY'
          import json, subprocess
          case='gc-lab/.test262-source/test/built-ins/Array/prototype/indexOf/length-zero-returns-minus-one.js'
          binary='gc-lab/target/release/js_check'
          for mode in ('tree','vm'):
              for stress in (False, True):
                  cmd=[binary,case,'--engine='+mode]
                  if stress: cmd.append('--gc-stress')
                  p=subprocess.run(cmd,text=True,capture_output=True,timeout=40)
                  print('mode=',mode,'stress=',stress,'returncode=',p.returncode,'stdout=',p.stdout[-1200:],'stderr=',p.stderr[-800:])
                  data=json.loads(p.stdout)
                  assert p.returncode==0 and data['status']=='passed' and data['cleanup'] is True
          PY
