name: MWR Set negative zero conformance
on:
  push:
    paths:
      - '.github/workflows/set-zero-audit.yml'
      - 'gc-lab/src/script/set_methods.rs'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  set-zero:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install stable Rust
        run: rustup toolchain install stable --profile minimal
      - name: Build checker
        run: cargo +stable build --manifest-path gc-lab/Cargo.toml --bin js_check --release --offline
      - name: Fetch pinned Test262
        run: python3 gc-lab/conformance/fetch.py
      - name: Verify Set zero normalization in Tree and VM, with and without GC stress
        run: |
          python3 - <<'PY'
          import json,subprocess
          methods=('union','intersection','symmetricDifference')
          for method in methods:
            case=f'gc-lab/.test262-source/test/built-ins/Set/prototype/{method}/converts-negative-zero.js'
            for mode in ('tree','vm'):
              for stress in (False,True):
                cmd=['gc-lab/target/release/js_check',case,'--engine='+mode]+(['--gc-stress'] if stress else [])
                p=subprocess.run(cmd,capture_output=True,text=True,timeout=40)
                print(method,mode,stress,p.returncode,p.stdout[-500:],p.stderr[-300:],flush=True)
                data=json.loads(p.stdout)
                assert p.returncode==0 and data['status']=='passed' and data['cleanup'] is True
          PY
