name: MWR full Test262 audit
on:
  push:
    paths:
      - '.github/workflows/full-conformance-audit.yml'
      - 'gc-lab/conformance/triage_results.py'
      - 'gc-lab/src/bin/js_check.rs'
      - 'gc-lab/src/script/asynchronous.rs'
      - 'gc-lab/src/script/dates.rs'
      - 'gc-lab/src/script/temporal.rs'
      - 'gc-lab/src/script/references.rs'
      - 'gc-lab/src/script/vm.rs'
      - 'gc-lab/src/script/interp.rs'
      - 'gc-lab/src/script/bytecode.rs'
      - 'gc-lab/src/script/bigint_vm.rs'
      - 'gc-lab/src/script/loops.rs'
      - 'gc-lab/src/script/builtins.rs'
      - 'gc-lab/src/script/execute.rs'
      - 'gc-lab/src/script/regexp_builtins.rs'
      - 'gc-lab/src/script/classes.rs'
      - 'gc-lab/src/script/set_methods.rs'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  full:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust
        run: rustup toolchain install stable --profile minimal
      - name: Build Temporal-enabled JS checker
        run: cargo +stable build --manifest-path gc-lab/temporal/Cargo.toml --release --locked
      - uses: actions/cache@v4
        with:
          path: gc-lab/.test262-source
          key: test262-e4fbf57745c6aae3d1f12f181ecef78b1665d812
      - name: Fetch pinned Test262
        run: python3 gc-lab/conformance/fetch.py
      - name: Execute all Test262 full-profile cases and keep expected failures
        id: test262
        shell: bash
        run: |
          set +e
          python3 gc-lab/conformance/run.py --profile full --source gc-lab/.test262-source \
            --binary gc-lab/temporal/target/release/js_check \
            --output gc-lab/conformance/results-audit-full --retry-timeouts 1
          status=$?
          set -e
          echo "runner_exit_code=$status" >> "$GITHUB_OUTPUT"
          test -f gc-lab/conformance/results-audit-full/summary.json
      - name: Compare fresh counts to previous recorded checkpoint
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path
          previous=json.loads(Path('gc-lab/conformance/results-full/summary.json').read_text())
          current=json.loads(Path('gc-lab/conformance/results-audit-full/summary.json').read_text())
          keys=('total','counts','revision')
          print(json.dumps({'previous':{k:previous[k] for k in keys},
                            'current':{k:current[k] for k in keys},
                            'new_failures':current['new_failures'],
                            'regressions':current['regressions'],
                            'retry':current['retry_timeouts']}, indent=2))
          assert current['total']==previous['total']
          assert current['revision']==previous['revision']
          assert not current['regressions'], 'Previously passing Test262 cases regressed'
          old_failed={case['path'] for case in previous['failures']}
          newly_failed={case['path'] for case in current['failures']}-old_failed
          assert not newly_failed, f'New failing Test262 cases: {sorted(newly_failed)[:20]}'
          assert current['counts']['passed']>=previous['counts']['passed'], 'Pass count dropped'
          # Last isolated full result: 47,484 passes after String fixes.
          # The 14 captured-environment tests passed in both engines; require
          # their gains to survive the merge before updating the documented baseline.
          assert current['counts']['passed']>=47516, 'Expected at least 47,516 passes'
          PY
      - name: Generate failure families and status transition inventory
        run: |
          python3 gc-lab/conformance/triage_results.py \
            gc-lab/conformance/results-audit-full/summary.json \
            --previous gc-lab/conformance/results-full/summary.json \
            --output gc-lab/conformance/results-audit-full/TRIAGE.md
      - name: Upload all full-suite results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mwr-test262-full-audit
          path: gc-lab/conformance/results-audit-full/
