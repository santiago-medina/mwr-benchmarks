name: GC laboratory
on:
  push:
    paths: ['gc-lab/**', '.github/workflows/gc-lab.yml']
  pull_request:
    paths: ['gc-lab/**', '.github/workflows/gc-lab.yml']
permissions:
  contents: read
jobs:
  contracts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust
        run: rustup toolchain install stable --profile minimal --component rustfmt
      - name: Formatting
        run: cargo +stable fmt --manifest-path gc-lab/Cargo.toml --check
      - name: Debug contracts
        run: cargo +stable test --manifest-path gc-lab/Cargo.toml --offline
      - name: Release contracts
        run: cargo +stable test --manifest-path gc-lab/Cargo.toml --release --offline
      - name: Two-heap recovery demo
        run: cargo +stable run --manifest-path gc-lab/Cargo.toml --bin dual_demo --release --offline
      - name: JavaScript button demo
        run: cargo +stable run --manifest-path gc-lab/Cargo.toml --bin script_demo --release --offline -- gc-lab/examples/button.js
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Differential subset corpus
        run: python3 gc-lab/compare_script.py --binary gc-lab/target/release/script_demo
  servo-integration:
    runs-on: ubuntu-24.04
    needs: contracts
    steps:
      - uses: actions/checkout@v4
      - name: Install Servo runtime libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y libgstreamer1.0-0 libgstreamer-plugins-base1.0-0 libgstreamer-plugins-bad1.0-0 libgstreamer-gl1.0-0 libegl1 libgl1-mesa-dri fonts-dejavu-core
      - name: Install Rust
        run: rustup toolchain install stable --profile minimal
      - name: Build Rust interpreter bridge
        run: cargo +stable build --manifest-path gc-lab/Cargo.toml --bin servo_bridge --release --offline
      - name: Fetch pinned Servo release
        run: python3 gc-lab/fetch_servo.py
      - name: Real Servo DOM and native click
        run: python3 gc-lab/run_servo_bridge.py --servo gc-lab/.servo-test/servo/servoshell
      - name: Preserve integration evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: servo-dom-bridge
          path: |
            gc-lab/servo-results/report.json
            gc-lab/servo-results/button.png
            gc-lab/servo-results/servo.log
            gc-lab/servo-results/bridge.log
  servo-native:
    runs-on: ubuntu-24.04
    needs: contracts
    timeout-minutes: 180
    env:
      CARGO_PROFILE_DEV_DEBUG: '0'
      CARGO_INCREMENTAL: '0'
      CARGO_BUILD_JOBS: '1'
    steps:
      - uses: actions/checkout@v4
      - name: Install native Servo build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y patch clang libclang-dev cmake ninja-build gperf m4 pkg-config libdbus-1-dev libfreetype-dev libfontconfig1-dev libglib2.0-dev libudev-dev libunwind-dev libssl-dev libx11-dev libxcb-render0-dev libxcb-shape0-dev libxcb-xfixes0-dev libxkbcommon-dev libxkbcommon-x11-0 libxrandr-dev libxi-dev libxcursor-dev libxinerama-dev libegl-dev libgles-dev libasound2-dev libgl1-mesa-dri fonts-dejavu-core
      - name: Install pinned Servo Rust toolchain
        run: rustup toolchain install 1.97.1 --profile minimal
      - name: Prepare pinned vendored Servo fork
        run: python3 gc-lab/servo-native/prepare.py
      - uses: actions/cache@v4
        with:
          path: gc-lab/.servo-native/target
          key: servo-native-gc-v1-0.7.0-rust-1.97.1-${{ hashFiles('gc-lab/servo-native/**', 'gc-lab/src/**') }}
          restore-keys: servo-native-gc-v1-0.7.0-rust-1.97.1-
      - name: Compile Servo with our interpreter linked inside script
        working-directory: gc-lab/.servo-native
        run: cargo +1.97.1 build -p servoshell --no-default-features --features bundled,js_jit --offline
      - name: Execute native callbacks without WebDriver or JS transport
        run: python3 gc-lab/servo-native/run.py --servo gc-lab/.servo-native/target/debug/servoshell
      - name: Collect real cross-heap cycles with the realm still alive
        run: python3 gc-lab/servo-native/run_gc.py --servo gc-lab/.servo-native/target/debug/servoshell
      - name: Preserve native integration evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: servo-native-interpreter
          path: |
            gc-lab/native-results/
            gc-lab/native-gc-results/
